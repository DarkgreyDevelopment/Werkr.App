syntax = "proto3";

option csharp_namespace = "Werkr.Agent.Protos";

import "EncryptedEnvelope.proto";

// Built-in action service.
// All RPCs use EncryptedEnvelope for request/response payloads.
// Request envelope contains a serialized ActionRequest.
// Streaming response envelopes each contain a serialized GrpcLogMsg.
service Action {
  rpc RunAction (werkr.common.protos.EncryptedEnvelope) returns (stream werkr.common.protos.EncryptedEnvelope);
}

// Inner payload message — serialized, encrypted, then placed inside EncryptedEnvelope.
// NOT used directly in the RPC signature.
message ActionRequest {
  string action_name = 1;
  string parameters_json = 2;
}
