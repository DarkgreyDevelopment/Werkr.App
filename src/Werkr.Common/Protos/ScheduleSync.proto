syntax = "proto3";
option csharp_namespace = "Werkr.Common.Protos";
package werkr.common.protos;

import "EncryptedEnvelope.proto";
import "ResponseMetadata.proto";

// Agent pulls assigned schedules from the Server (API hosts this service).
// All RPCs use EncryptedEnvelope. Inner payload types defined below.
service ScheduleSync {
  // Request envelope contains AgentScheduleRequest; response contains AgentScheduleResponse.
  rpc GetAssignedSchedules (EncryptedEnvelope) returns (EncryptedEnvelope);
  // Request envelope contains GetBulkScheduleHolidayDatesRequest; response contains GetBulkScheduleHolidayDatesResponse.
  rpc GetBulkScheduleHolidayDates (EncryptedEnvelope) returns (EncryptedEnvelope);
  // Request envelope contains SubmitAuditLogRequest; response contains SubmitAuditLogResponse.
  rpc SubmitAuditLog (EncryptedEnvelope) returns (EncryptedEnvelope);
}

message AgentScheduleRequest {
  // Agent's tags for matching against task TargetTags.
  repeated string tags = 1;
  // Agent's connection ID for authentication.
  string connection_id = 2;
}

message AgentScheduleResponse {
  repeated ScheduledTaskDefinition tasks = 1;
  repeated ScheduledWorkflowDefinition workflows = 2;
  repeated FileMonitorTriggerDef file_monitor_triggers = 3;
  // Cross-cutting response metadata.
  ResponseMetadata metadata = 15;
}

message ScheduledTaskDefinition {
  int64 task_id = 1;
  string name = 2;
  int32 action_type = 3;
  string content = 4;
  int64 timeout_minutes = 5;
  int32 sync_interval_minutes = 6;
  ScheduleDefinition schedule = 7;
  string success_criteria = 8;
  repeated string arguments = 9;
  string action_sub_type = 10;
  string action_parameters_json = 11;
  map<string, string> resolved_credentials = 12;
}

message ScheduleDefinition {
  string schedule_id = 1;
  string start_date = 2;
  string start_time = 3;
  string time_zone_id = 4;
  string expiration_date = 5;
  string expiration_time = 6;
  string expiration_time_zone_id = 7;
  int64 stop_task_after_minutes = 8;
  DailyRecurrenceDef daily = 9;
  WeeklyRecurrenceDef weekly = 10;
  MonthlyRecurrenceDef monthly = 11;
  RepeatOptionsDef repeat = 12;
  bool has_holiday_calendar = 13;
  string holiday_calendar_mode = 14;
  bool catch_up_enabled = 15;
  int32 shift_mode = 16;             // 0=None, 1=NextBusinessDay, 2=PreviousBusinessDay, 3=NearestBusinessDay
  CalendarDefinition calendar = 17;  // Full calendar with rules for client-side evaluation
  bool is_fixed_offset = 18;             // Start timezone is a fixed UTC offset (no DST)
  bool expiration_is_fixed_offset = 19;  // Expiration timezone is a fixed UTC offset (no DST)
}

message DailyRecurrenceDef {
  int32 day_interval = 1;
}

message WeeklyRecurrenceDef {
  int32 week_interval = 1;
  int32 recurrence_days = 2;
}

message MonthlyRecurrenceDef {
  repeated int32 day_numbers = 1;
  int32 months_of_year = 2;
  int32 week_number = 3;
  int32 days_of_week = 4;
}

message RepeatOptionsDef {
  int32 interval_minutes = 1;
  int32 duration_minutes = 2;
}

message ScheduledWorkflowDefinition {
  int64 workflow_id = 1;
  string name = 2;
  repeated ScheduledWorkflowStepDef steps = 3;
  ScheduleDefinition schedule = 4;
  repeated WorkflowVariableDef variables = 5;       // Design-time variable definitions
  string workflow_run_id = 6;                        // API-generated run ID
  map<string, string> trigger_variables = 7;         // Per-execution trigger param overrides
  repeated int64 prior_succeeded_step_ids = 8;       // Step IDs that already succeeded (retry-from-failed)
  map<string, string> run_variable_values = 9;        // Latest variable values from the run (retry-from-failed)
  repeated ChildWorkflowDefinition child_workflows = 10;  // Child workflows for composite steps
}

message WorkflowVariableDef {
  string name = 1;
  string default_value = 2;         // JSON blob or empty
  string data_type = 3;             // Optional data-type hint (e.g. "string", "int", "json")
  bool is_required = 4;             // Whether the variable must be supplied before run start
  bool log_redaction = 5;           // When true, value is redacted from logs and UI
}

message ScheduledWorkflowStepDef {
  int64 step_id = 1;
  int64 task_id = 2;
  int32 order = 3;
  repeated int64 depends_on_step_ids = 4;
  int32 control_statement = 5;
  string condition_expression = 6;
  int32 max_iterations = 7;
  ScheduledTaskDefinition task = 8;
  string agent_connection_id_override = 9;
  int32 dependency_mode = 10;
  string input_variable_name = 11;   // Step's declared input variable
  string output_variable_name = 12;  // Step's declared output variable
  bool is_composite = 13;
  int32 composite_type = 14;         // Maps to CompositeType enum
  int64 child_workflow_id = 15;
  string iteration_variable_name = 16;
  string collection_variable_name = 17;
}

message ChildWorkflowDefinition {
  int64 child_workflow_id = 1;
  repeated ScheduledWorkflowStepDef steps = 2;
  repeated WorkflowVariableDef variables = 3;
}

// ── Bulk Holiday Date Fetch ──

message GetBulkScheduleHolidayDatesRequest {
  repeated ScheduleHolidayDateQuery queries = 1;
  string start_date = 2;
  string end_date = 3;
}

message ScheduleHolidayDateQuery {
  string schedule_id = 1;
}

message GetBulkScheduleHolidayDatesResponse {
  repeated ScheduleHolidayDateResult results = 1;
  // Cross-cutting response metadata.
  ResponseMetadata metadata = 15;
}

message ScheduleHolidayDateResult {
  string schedule_id = 1;
  string calendar_id = 2;
  string mode = 3;
  repeated HolidayDateMessage dates = 4;
}

message HolidayDateMessage {
  string date = 1;
  string name = 2;
  int32 year = 3;
  string window_start = 4;
  string window_end = 5;
  string window_time_zone_id = 6;
}

message HolidayRuleDefinition {
  string name = 1;
  int32 rule_type = 2;             // 0=FixedDate, 1=NthWeekdayOfMonth, 2=LastWeekdayOfMonth
  int32 month = 3;                 // 1-12
  int32 day = 4;                   // 1-31 for FixedDate
  int32 day_of_week = 5;           // 0=Sunday through 6=Saturday
  int32 week_number = 6;           // 1-5 for NthWeekdayOfMonth
  int32 observance_rule = 7;       // maps to ObservanceRule enum
  int32 year_start = 8;            // 0 = no lower bound
  int32 year_end = 9;              // 0 = no upper bound
  string window_start = 10;        // TimeOnly ISO format or empty
  string window_end = 11;          // TimeOnly ISO format or empty
  string window_time_zone_id = 12;
}

message CalendarDefinition {
  string calendar_id = 1;
  string name = 2;
  repeated HolidayRuleDefinition holiday_rules = 3;
  int32 working_days = 4;          // DaysOfWeek flags bitmask
}

// ── Audit Log Submission ──

message SubmitAuditLogRequest {
  string schedule_id = 1;
  repeated AuditLogEntry entries = 2;
}

message AuditLogEntry {
  string occurrence_utc = 1;
  string holiday_name = 2;
  string reason = 3;
  string action = 4;              // "Suppressed" or "Shifted"
  string shifted_to_utc = 5;      // ISO 8601 datetime or empty
}

message SubmitAuditLogResponse {
  int32 accepted_count = 1;
  // Cross-cutting response metadata.
  ResponseMetadata metadata = 15;
}

// ── File Monitor Trigger Definitions ──

message FileMonitorTriggerDef {
  int64 trigger_id = 1;
  int64 workflow_id = 2;
  string watch_directory = 3;
  string file_pattern = 4;
  repeated string event_types = 5;
  int32 debounce_ms = 6;
}
