syntax = "proto3";
option csharp_namespace = "Werkr.Common.Protos";
package werkr.common.protos;

import "EncryptedEnvelope.proto";

// Server pushes schedule invalidation notifications to agents (Agent hosts this service).
// All RPCs use EncryptedEnvelope. Inner payload types defined below.
service ScheduleInvalidation {
  // Request envelope contains InvalidateScheduleRequest; response contains InvalidateScheduleResponse.
  rpc InvalidateSchedule (EncryptedEnvelope) returns (EncryptedEnvelope);

  // Request envelope contains NotifyWorkflowDisabledRequest; response contains NotifyWorkflowDisabledResponse.
  rpc NotifyWorkflowDisabled (EncryptedEnvelope) returns (EncryptedEnvelope);
}

// Inner payload messages — serialized, encrypted, then placed inside EncryptedEnvelope.
message InvalidateScheduleRequest {
  // The schedule ID that was modified or deleted.
  string schedule_id = 1;
}

message InvalidateScheduleResponse {
  // Whether the agent acknowledged the invalidation.
  bool acknowledged = 1;
}

// Notifies the agent that a workflow has been disabled.
// The agent should cancel any in-flight runs for the specified workflow.
message NotifyWorkflowDisabledRequest {
  int64 workflow_id = 1;
}

message NotifyWorkflowDisabledResponse {
  bool acknowledged = 1;
}
