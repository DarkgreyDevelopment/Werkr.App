syntax = "proto3";
option csharp_namespace = "Werkr.Common.Protos";
package werkr.common.protos;

import "EncryptedEnvelope.proto";
import "ResponseMetadata.proto";

// The Server (Werkr.Api) hosts this service.
// The Agent calls RegisterAgent after decrypting the admin-carried bundle.
// Request envelope contains RegisterAgentRequest; response contains RegisterAgentResponse.
// Encrypted using a password-derived AES-256 key from the registration bundle.
// Agent sends x-werkr-bundle-id header for bundle lookup.
service AgentRegistration {
  rpc RegisterAgent (EncryptedEnvelope) returns (EncryptedEnvelope);
}

message RegisterAgentRequest {
  // 16-byte correlation token from the bundle — identifies which RegistrationBundle to complete
  bytes bundle_id = 1;

  // Agent's serialized RSA public key, hybrid-encrypted with the Server's public key:
  // AES-GCM encrypts the key bytes, RSA-OAEP-SHA3-512 encrypts only the AES key material.
  // Format: rsaEncryptedAesKey | nonce | tag | ciphertext
  bytes encrypted_agent_public_key = 2;

  // Agent's gRPC endpoint URL (e.g., "https://agent-host:5001")
  string agent_url = 3;

  // Human-readable Agent name
  string agent_name = 4;

  // Agent's assembly version string
  string agent_version = 5;
}

message RegisterAgentResponse {
  // Whether registration succeeded
  bool success = 1;

  // Hybrid-encrypted RegistrationResponsePayload (JSON -> HybridEncrypt with Agent's public key).
  // Contains: API key (raw string for Agent to store) + SharedKey (32-byte AES-256 symmetric key
  // for ongoing message encryption). Empty on failure.
  bytes encrypted_registration_data = 2;

  // Human-readable status message (success confirmation or error description)
  string message = 3;

  // Cross-cutting response metadata.
  ResponseMetadata metadata = 15;
}
