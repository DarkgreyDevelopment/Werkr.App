syntax = "proto3";
option csharp_namespace = "Werkr.Common.Protos";
package werkr.common.protos;

import "EncryptedEnvelope.proto";
import "ResponseMetadata.proto";

// Bidirectional stream between agent and server for real-time output delivery.
// Agent opens this stream on startup with bearer token authentication.
// Each message in both directions is an EncryptedEnvelope.
// Agent sends EncryptedEnvelope containing OutputMessage;
// server sends EncryptedEnvelope containing OutputSubscription.
service OutputStreamingService {
  rpc StreamOutput (stream EncryptedEnvelope) returns (stream EncryptedEnvelope);
}

message OutputMessage {
  int64 task_id = 1;
  string schedule_id = 2;
  string job_id = 3;
  oneof payload {
    OutputLine line = 4;
    OutputComplete complete = 5;
  }
  // Workflow context — populated by the agent during workflow execution.
  string workflow_run_id = 6;
  int64  step_id = 7;
}

message OutputLine {
  string text = 1;
  string log_level = 2;
  string timestamp = 3;
}

message OutputComplete {
  int32 exit_code = 1;
  bool success = 2;
  string error_message = 3;
}

message OutputSubscription {
  int64 task_id = 1;
  string schedule_id = 2;
  bool subscribe = 3;
  // Cross-cutting response metadata.
  ResponseMetadata metadata = 15;
}
