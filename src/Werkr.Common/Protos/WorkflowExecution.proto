syntax = "proto3";
option csharp_namespace = "Werkr.Common.Protos";
package werkr.common.protos;

import "EncryptedEnvelope.proto";

// Agent requests the server to orchestrate a workflow execution (API hosts this service).
// All RPCs use EncryptedEnvelope. Inner payload types defined below.
service WorkflowExecution {
  // Request envelope contains WorkflowRunGrpcRequest; response contains WorkflowRunGrpcResponse.
  rpc RequestWorkflowRun (EncryptedEnvelope) returns (EncryptedEnvelope);
}

message WorkflowRunGrpcRequest {
  // Agent's connection ID for authentication.
  string connection_id = 1;
  // The workflow ID to execute.
  int64 workflow_id = 2;
}

message WorkflowRunGrpcResponse {
  // Whether the server accepted the workflow run request.
  bool accepted = 1;
  // The assigned workflow run ID.
  string workflow_run_id = 2;
  // Human-readable status message.
  string message = 3;
}
